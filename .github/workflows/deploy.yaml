on:
  push:
    branches: 
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a main run mid-deploy (pm2 stopped / rsync running)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 工作流程
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:   
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Cache node_modules
        id: modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Nuxt prepare (when node_modules restored from cache)
        if: steps.modules-cache.outputs.cache-hit == 'true'
        run: npx nuxt prepare

      - name: Build and Replace Env
        run: |
          npm run build
        env:
          NUXT_PUBLIC_DOMAIN: ${{ secrets.NUXT_PUBLIC_DOMAIN }}
          NUXT_PUBLIC_MINIO: ${{ secrets.NUXT_PUBLIC_MINIO_BASE }}
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}

      - name: Stop pm2
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          port: 22
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 更改要更停止 ecosystem.config.js 的位置
            cd /home/user/front-end
            pm2 stop ecosystem.config.js
            rm -fr .output

      - name: Sync Dis Files to AlmaLinux VM
        if: github.ref == 'refs/heads/main'
        uses: burnett01/rsync-deployments@v8
        with:
          remote_host: ${{ secrets.GCP_VM_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

          path: ".output"
        # 設置 remote path
          remote_path: "/home/user/front-end"
          debug: true          
          switches: "-avz --delete --include='.output/***' --include='.env' --include='ecosystem.config.js' --exclude='*'"
          # switches: "-avz --delete" 新增可以移除舊檔
          

      - name: Start pm2
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          port: 22
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/user/front-end
            pm2 delete ecosystem.config.js || true
            pm2 start ecosystem.config.js
            pm2 save 

